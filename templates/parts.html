<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LEGO Parts List</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f0f0f0; padding: 20px; }
    table { width: 100%; border-collapse: collapse; background: white; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    th, td { padding: 10px; border: 1px solid #ddd; text-align: center; }
    th { background-color: #444; color: white; }
    img { height: 50px; }
  </style>
</head>
<body>
  <h1>🧱 LEGO Parts List</h1>
  <table>
    <thead>
      <tr>
        <th>Brick Type</th>
        <th>Color</th>
        <th>Part ID</th>
        <th>Quantity</th>
        <th>Preview</th>
      </tr>
    </thead>
    <tbody>
      {% for part in parts %}
      <tr>
        <td>{{ part['Brick Type'] }}</td>
        <td>{{ part['Color'] }}</td>
        <td>{{ part['Part ID'] }}</td>
        <td>{{ part['Quantity'] }}</td>
        <td><img src="{{ part['Image URL'] }}" alt="Part {{ part['Part ID'] }}"></td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</body>
</html>
